# Publishes the frontend to Cloudflare Pages (project base-vital) on every push to main.
# Spec: specs/005-despliegue (FR-005; Pages only, no Workers). Decision D12 in
# specs/001-chequeo-diario-voz-cuerpo/decisions.md.
# Required repository secrets (never in the code): CLOUDFLARE_API_TOKEN (permission
# "Cloudflare Pages: Edit") and CLOUDFLARE_ACCOUNT_ID.
name: Publish to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-production
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      HAS_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - name: Skip publish (no Cloudflare token configured)
        if: env.HAS_CF_TOKEN != 'true'
        run: echo "::notice::CLOUDFLARE_API_TOKEN is not set; tests and build ran, publish skipped. See README > Deploy."
      - name: Deploy to Pages (only Pages, never Workers)
        if: env.HAS_CF_TOKEN == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          npx --yes wrangler@4 pages deploy frontend/dist
          --project-name base-vital --branch main
          --commit-hash "${GITHUB_SHA::7}" --commit-dirty=true
